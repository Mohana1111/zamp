services:
  - type: web
    name: zamp-ap-automation
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: ENABLE_LOCAL_OCR
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_BOT_EMAIL
        sync: false
      - key: AGENT_BOT_APP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
